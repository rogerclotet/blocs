stages:
  - prepare
  - build

# Configure these in GitLab: Settings → CI/CD → Variables
#
# Required:
#   UNITY_LICENSE_BASE64       Base64-encoded .ulf file (masked; recommended)
#   ANDROID_KEYSTORE_BASE64    Base64-encoded upload keystore (masked)
#   KEYSTORE_PASS              Keystore password (masked)
#   KEY_ALIAS_NAME             Key alias, e.g. blocs
#   KEY_ALIAS_PASS             Key alias password (masked)
#
# Optional:
#   VERSION_NUMBER_VAR         Override PlayerSettings bundle version string

variables:
  BUILD_NAME: Blocs
  BUILD_TARGET: Android
  BUILD_APP_BUNDLE: "true"
  IMAGE: unityci/editor
  IMAGE_VERSION: "3"
  UNITY_DIR: $CI_PROJECT_DIR
  VERSION_BUILD_VAR: $CI_PIPELINE_IID
  GIT_DEPTH: 1

image: $IMAGE:$UNITY_VERSION-base-$IMAGE_VERSION

get-unity-version:
  image: alpine:3.20
  stage: prepare
  script:
    - echo "UNITY_VERSION=$(grep 'm_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')" | tee prepare.env
  artifacts:
    reports:
      dotenv: prepare.env

.unity_before_script: &unity_before_script
  before_script:
    - chmod +x ./ci/before_script.sh && ./ci/before_script.sh
  needs:
    - job: get-unity-version
      artifacts: true

.unity_after_script: &unity_after_script
  after_script:
    - chmod +x ./ci/return_license.sh && ./ci/return_license.sh || true

.cache: &cache
  cache:
    key: "$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG-android"
    paths:
      - Library/
      - ../unity-builder

build-android:
  stage: build
  # Unity Android images exceed the 30 GB disk on saas-linux-small-amd64 runners.
  tags:
    - saas-linux-medium-amd64
  image: $IMAGE:$UNITY_VERSION-android-$IMAGE_VERSION
  <<: *unity_before_script
  <<: *cache
  <<: *unity_after_script
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - chmod +x ./ci/build.sh && ./ci/build.sh
  artifacts:
    name: "blocs-android-$CI_PIPELINE_IID"
    when: always
    expire_in: 30 days
    paths:
      - Builds/Android/Blocs.aab
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
